    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ssh.readysetcomply.com
        username: u2828-krlqriqezvfn
        password: `${{ secrets.SFTP_PASSWORD }}
        port: 18765
