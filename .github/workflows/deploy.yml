          mkdir -p /home/u2828-krlqriqezvfn/public_html/wp-content/themes/generatepress-child/
    - uses: appleboy/scp-action@v0.1.7
      with:
        host: ssh.readysetcomply.com
        username: u2828-krlqriqezvfn
        password: `${{ secrets.SFTP_PASSWORD }}
        port: 18765
        source: public_html/wp-content/themes/generatepress-child/
        target: /home/u2828-krlqriqezvfn/public_html/wp-content/themes/
        strip_components: 3
"@

$yamlContent | Out-File -FilePath ".github\workflows\deploy.yml" -Encoding UTF8 -NoNewline