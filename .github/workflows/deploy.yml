    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: appleboy/scp-action@v0.1.7
      with:
        host: ssh.readysetcomply.com
        username: u2828-krlqriqezvfn
        password: `${{ secrets.SFTP_PASSWORD }}
        port: 18765
        source: public_html/wp-content/themes/generatepress-child/*
        target: /home/u2828-krlqriqezvfn/public_html/wp-content/themes/generatepress-child/
        strip_components: 4
"@

$yamlContent | Out-File -FilePath ".github\workflows\deploy.yml" -Encoding UTF8 -NoNewline